[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-quant"
version = "0.1.0"
description = "Leakage-aware earnings-event quantitative research and backtesting"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.5",
  "statsmodels>=0.14", "yfinance>=1.0", "requests>=2.32",
  "pyarrow>=17", "matplotlib>=3.9", "joblib>=1.4", "PyYAML>=6.0",
  "textual>=1.0"
]

[project.scripts]
earnings-quant = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3"]
xgboost = ["xgboost>=2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
