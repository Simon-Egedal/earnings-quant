project:
  random_seed: 42
  data_dir: data
  results_dir: results

sec:
  # SEC requires a real organization/name and contact email. Override before collection.
  user_agent: "EarningsQuant research@example.com"
  requests_per_second: 5
  cache_days: 7

alpha_vantage:
  # Obtain a free key from https://www.alphavantage.co/support/#api-key and
  # store it in this environment variable. Never commit the key itself.
  api_key_env: ALPHA_VANTAGE_API_KEY
  cache_days: 7

universe:
  source: sp500
  target_size: 100
  minimum_market_cap: 2000000000
  tickers: []

collection:
  start_date: "2015-01-01"
  price_symbol: "SPY"
  refresh_prices_hours: 24
  refresh_estimates_hours: 6

model:
  financial_targets: [actual_eps, actual_revenue, actual_operating_margin, actual_fcf]
  reaction_target: abnormal_return_3d
  minimum_train_rows: 100
  random_seed: 42

# Ticker-first model search. Accuracy is 1 - weighted absolute percentage
# error on chronological, unseen quarters and is always reported from 0 to 1.
ticker_model:
  history_years: 10
  minimum_accuracy: 0.8
  minimum_train_quarters: 8
  backtest_quarters: 8

walk_forward:
  first_train_year: 2016
  first_test_year: 2022
  final_test_year: 2025

backtest:
  long_threshold: 0.02
  short_threshold: -0.02
  minimum_confidence: 0.55
  commission: 0.0
  slippage: 0.001

scanner:
  default_days: 14
  default_top: 20
  minimum_training_tickers: 20
  minimum_quarterly_history: 4
  minimum_annual_history: 2
  maximum_revenue_anchor_ratio: 5.0
  minimum_walk_forward_auc: 0.52
  minimum_walk_forward_r2: 0.0
